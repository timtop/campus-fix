services:
  - type: web
    name: campusfix
    runtime: docker
    plan: starter
    healthCheckPath: /api/health
    envVars:
      - key: DATABASE_URL
        value: file:/data/campusfix.db
      - key: COOKIE_SECURE
        value: 'true'
    disk:
      name: campusfix-data
      mountPath: /data
      sizeGB: 1
